name: Deploy API

# Деплой серверної частини (Cloud Functions, правила Firestore, Hosting для api-піддомену).
# Сайт публікується окремо на GitHub Pages (pages.yml).
# Поки не задано змінну GCP_WIF_PROVIDER, цей workflow пропускається.
# Деплой лише після злиття в main і лише після ручного схвалення в середовищі
# "production" (Settings → Environments → production → Required reviewers).
# Авторизація — Workload Identity Federation, без ключів сервісних акаунтів у GitHub.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm --prefix functions ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Write functions params (не секрети)
        run: |
          cat > functions/.env.${{ vars.VITE_FIREBASE_PROJECT_ID }} <<EOF
          PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
          SITE_URL=${{ vars.SITE_URL }}
          KMS_KEY_NAME=${{ vars.KMS_KEY_NAME }}
          ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
          TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}
          META_LOGIN_CONFIG_ID=${{ vars.META_LOGIN_CONFIG_ID }}
          EOF

      - name: Deploy
        run: npx firebase-tools@14 deploy --project ${{ vars.VITE_FIREBASE_PROJECT_ID }} --only hosting,functions,firestore --non-interactive --force
