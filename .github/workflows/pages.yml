name: Pages

# Публікація сайту (web/) на GitHub Pages після злиття в main.
# Налаштування репозиторію: Settings → Pages → Source: GitHub Actions,
# Custom domain: kdstatsforme.pp.ua, Enforce HTTPS.
# Значення сайту беруться з Settings → Secrets and variables → Actions → Variables
# (усі публічні, секретів тут немає).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'functions/src/config/platforms.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm --prefix web ci

      - name: Build
        run: npm --prefix web run build
        env:
          VITE_SITE_DOMAIN: ${{ vars.VITE_SITE_DOMAIN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COMPANY: ${{ vars.VITE_COMPANY }}
          VITE_ADDRESS: ${{ vars.VITE_ADDRESS }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
